# Настройки Alembic — инструмента миграций базы данных.
#
# Миграция — это файл с инструкцией "как изменить структуру базы"
# (создать таблицу, добавить колонку). Миграции лежат в migrations/versions/
# и применяются по порядку. В базе Alembic хранит номер последней
# применённой миграции, поэтому `alembic upgrade head` применяет только новые.
#
# Адрес базы здесь не указан — он берётся из настроек бота
# (см. migrations/env.py), чтобы не дублировать пароль.

[alembic]
script_location = migrations
# Добавить корень проекта в пути поиска модулей — иначе env.py не найдёт пакет culinary_bot.
prepend_sys_path = .
# Имена файлов миграций: дата_время_номер_описание.py — так их удобно читать по порядку.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
